[package]
name = "flitzis-looper-analysis"
version = "0.1.0"
edition = "2024"

[lib]
name = "flitzis_looper_analysis"

[features]
native-inference-trial = ["dep:libloading"]
native-inference-dynamic = ["native-inference-trial", "ort/load-dynamic"]
native-inference-cuda = ["native-inference-dynamic", "ort/cuda"]
native-beat-this-worker = ["native-inference-cuda", "dep:serde", "dep:serde_json"]
demucs-inference-trial = ["native-inference-trial", "dep:flitzis-stem-dsp"]
native-demucs-worker = ["demucs-inference-trial", "native-inference-dynamic", "dep:serde", "dep:serde_json"]

[[example]]
name = "beat_this_native"
required-features = ["native-inference-trial"]

[[example]]
name = "beat_this_audio"
required-features = ["native-inference-trial"]

[[example]]
name = "demucs_attention_control"
required-features = ["native-inference-dynamic"]

[[example]]
name = "demucs_inline_load_control"
required-features = ["native-inference-dynamic"]

[[bin]]
name = "native-beat-this-worker"
path = "src/beat_worker.rs"
required-features = ["native-beat-this-worker"]

[[bin]]
name = "native-htdemucs-worker"
path = "src/demucs_worker.rs"
required-features = ["native-demucs-worker"]

[dependencies]
flitzis-stem-dsp = { path = "../stem-dsp", optional = true }
matrixmultiply = "0.3"
libloading = { version = "0.9", optional = true }
num-complex = "0.4"
ort = "2.0.0-rc.12"
realfft = "3.4"
rubato = "0.14"
rustfft = "6.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all", "opt-simd", "default"] }
