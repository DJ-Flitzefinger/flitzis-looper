[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "flitzis-looper"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "demucs>=4.0.1,<5",
    "flitzis-bs-roformer==0.1.0",
    "imgui-bundle>=1.92.5",
    "pydantic>=2.12.5",
    "torch==2.12.0",
    "torchaudio==2.11.0",
    "torchcodec==0.13.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
flitzis-bs-roformer = { path = "vendor/bs_roformer" }

[dependency-groups]
dev = [
    "maturin>=1.10.2; platform_system == 'Windows'",
    "maturin[patchelf]>=1.10.2; platform_system != 'Windows'",
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.ruff]
extend = "ruff_defaults.toml"

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_explicit = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
norecursedirs = ["old-project"]
markers = ["audio_device: opens a real audio device; requires explicit --audio-devices"]

[tool.maturin]
manifest-path = "rust/crates/looper/Cargo.toml"

[tool.coverage.run]
omit = ["src/tests/*", "src/flitzis_looper/ui/render/*"]
